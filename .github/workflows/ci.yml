name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ${{ matrix.os }}
    env:
      GOFLAGS: -p=1
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: make test-docs
      - run: make test
        env:
          SHEPHRD_TEST_DIAGNOSTICS: ${{ github.event_name == 'pull_request' && format('{0}/shephrd-subdriver-diagnostic', runner.temp) || '' }}
      - if: ${{ failure() && github.event_name == 'pull_request' && matrix.os == 'ubuntu-24.04' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: subdriver-pull-request-ubuntu-${{ github.run_attempt }}
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/shephrd-subdriver-diagnostic/store.sqlite
            ${{ runner.temp }}/shephrd-subdriver-diagnostic/events.jsonl
            ${{ runner.temp }}/shephrd-subdriver-diagnostic/wake-trace.jsonl
      - run: make test-extension
      - run: go vet ./...
      - run: git diff --check
